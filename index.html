<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <title>3Delta Engenharia | Modelo BIM</title>
  <style>
    :root{--orange:#ff6a00;--ink:#2f2e2c;--muted:#706d69;--paper:#fff;--panel:rgba(255,255,255,.95);--shadow:0 10px 30px rgba(0,0,0,.13)}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f2f0;color:var(--ink)}
    #viewer{position:absolute;inset:0;background:linear-gradient(#fafafa,#eceae7)} #viewer canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
    .topbar{position:absolute;z-index:10;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));min-height:64px;display:flex;align-items:center;gap:14px;padding:9px 12px;background:var(--panel);border-radius:15px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:116px;height:46px;object-fit:contain;background:#fff;border-radius:8px}.brand-copy{min-width:0}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;color:var(--orange)}.title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.busy{background:var(--orange);animation:pulse 1.2s infinite}.dot.ok{background:#38a457}.dot.error{background:#c83d3d}@keyframes pulse{50%{opacity:.35}}
    .loader{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(248,247,245,.97);transition:.25s}.loader.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(420px,calc(100vw - 34px));padding:24px;background:#fff;border-radius:18px;box-shadow:var(--shadow);text-align:center}.card img{width:190px;max-width:72%;height:auto;margin-bottom:14px}.loader-title{font-weight:800;font-size:17px}.loader-copy{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px}.track{height:7px;margin-top:18px;background:#ebe8e4;border-radius:999px;overflow:hidden}.bar{height:100%;width:4%;background:var(--orange);border-radius:inherit;transition:width .15s}.progress{font-size:11px;color:var(--muted);margin-top:9px}.error{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#fff1f0;color:#9c2727;font-size:12px;text-align:left;line-height:1.4}.error.show{display:block}
    .toolbar{position:absolute;z-index:12;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:5px;padding:6px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}.tool{border:0;background:transparent;color:var(--ink);height:46px;min-width:66px;padding:6px 9px;border-radius:10px;font:inherit;font-size:10px;font-weight:750;cursor:pointer}.tool:hover{background:#f2efec}.tool:active{transform:translateY(1px)}
    .hint{position:absolute;z-index:9;right:12px;bottom:82px;background:rgba(47,46,44,.82);color:#fff;border-radius:10px;padding:8px 10px;font-size:10px;transition:opacity .4s}.hint.hide{opacity:0}
    @media(max-width:680px){.topbar{left:8px;right:8px;min-height:58px;padding:8px 9px}.brand img{width:90px;height:38px}.title{font-size:13px}.subtitle{font-size:10px}.status{display:none}.toolbar{width:calc(100vw - 16px);justify-content:center;bottom:max(8px,env(safe-area-inset-bottom))}.tool{flex:1;min-width:0}.hint{right:8px;bottom:70px}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
      "web-ifc": "https://unpkg.com/web-ifc@0.0.77/web-ifc-api.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <header class="topbar">
    <div class="brand"><img src="./logo-3delta.jpg" alt="3Delta Engenharia"><div class="brand-copy"><div class="eyebrow">Modelo BIM</div><div class="title">H741 — LEÃO | Estrutural</div><div class="subtitle" id="model-meta">Carregando modelo IFC…</div></div></div>
    <div class="status"><span class="dot busy" id="status-dot"></span><span id="status-text">Carregando</span></div>
  </header>
  <div class="loader" id="loader"><div class="card"><img src="./logo-3delta.jpg" alt="3Delta Engenharia"><div class="loader-title">Abrindo o modelo 3D</div><div class="loader-copy">O modelo é aberto diretamente no navegador. Não é necessário instalar aplicativo nem fazer login.</div><div class="track"><div class="bar" id="progress-bar"></div></div><div class="progress" id="progress-text">Preparando…</div><div class="error" id="error-box"></div></div></div>
  <div class="hint" id="hint">1 dedo: girar • 2 dedos: zoom/pan</div>
  <nav class="toolbar"><button class="tool" id="btn-fit">Enquadrar</button><button class="tool" id="btn-iso">3D</button><button class="tool" id="btn-top">Superior</button><button class="tool" id="btn-front">Frontal</button></nav>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
